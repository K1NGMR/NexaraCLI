name: CLI CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and integration checks
        run: npm run check

      - name: Run test suite
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          exit_code=$?
          cat test-output.log
          if [ "$exit_code" -ne 0 ]; then
            # See release.yml's identical step for why this exists: the raw
            # job log needs an authenticated GitHub session to view, so a
            # CI-only failure was otherwise invisible to anyone without repo
            # access. ::error:: annotations render on the public run summary
            # with no sign-in required.
            tail -n 40 test-output.log | while IFS= read -r line; do
              sanitized="${line//$'\r'/}"
              echo "::error::${sanitized}"
            done
          fi
          exit $exit_code

      - name: Verify packaged installation
        run: npm run pack:smoke

      - name: Verify package contents
        run: npm run pack:check
