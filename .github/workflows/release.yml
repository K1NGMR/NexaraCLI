name: Release CLI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run test suite
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          exit_code=$?
          cat test-output.log
          if [ "$exit_code" -ne 0 ]; then
            # The raw job log requires an authenticated GitHub session to
            # view, which made a CI-only test failure completely opaque from
            # outside that session -- no way to see WHY npm test failed
            # short of asking someone with repo access to open the run and
            # copy-paste it. Annotations (::error::) are rendered on the
            # PUBLIC run summary page with no sign-in required, so mirror the
            # failing output there too. GitHub caps how many of these render,
            # so only the tail (where the actual failure/exception is) goes
            # through, not the full passing-tests output above it.
            tail -n 40 test-output.log | while IFS= read -r line; do
              sanitized="${line//$'\r'/}"
              echo "::error::${sanitized}"
            done
          fi
          exit $exit_code
      - run: npm pack --silent
      - name: Create checksum manifest
        shell: bash
        run: |
          package_file="$(find . -maxdepth 1 -type f -name 'nexara-cli-*.tgz' -print -quit)"
          package_name="${package_file#./}"
          version="${GITHUB_REF_NAME#v}"
          hash="$(sha256sum "$package_file" | cut -d ' ' -f 1)"
          node -e "require('fs').writeFileSync('checksums.json', JSON.stringify({version: process.argv[1], files: {[process.argv[2]]: process.argv[3]}}, null, 2) + '\\n')" "$version" "$package_name" "$hash"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nexara-cli-*.tgz
            checksums.json
